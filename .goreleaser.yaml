version: 2

project_name: movidesk-cli

before:
  hooks:
    - go mod tidy
    - go test -count=1 ./...

builds:
  - id: movidesk-cli
    main: ./cmd/movidesk-cli
    binary: movidesk-cli
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/jonasandre/movidesk-cli/internal/version.Version={{.Version}}
      - -X github.com/jonasandre/movidesk-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/jonasandre/movidesk-cli/internal/version.Date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ .Version }}-next'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  draft: true
  prerelease: auto
  header: |
    ## movidesk-cli {{ .Tag }}

    Pre-built binaries for darwin / linux / windows on amd64 and arm64.

    ```bash
    # Homebrew (macOS / Linux)
    brew install jonasandre/movidesk/movidesk-cli

    # Direct download
    curl -L https://github.com/jonasandre/movidesk-cli/releases/download/{{ .Tag }}/movidesk-cli_{{ trimprefix .Tag "v" }}_$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/').tar.gz | tar xz
    ```
  footer: |
    **Full Changelog**: https://github.com/jonasandre/movidesk-cli/compare/{{ .PreviousTag }}...{{ .Tag }}

homebrew_casks:
  - name: movidesk-cli
    repository:
      owner: jonasandre
      name: homebrew-movidesk
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    directory: Casks
    homepage: https://github.com/jonasandre/movidesk-cli
    description: CLI for the Movidesk REST API
    license: MIT
    completions:
      bash: completions/movidesk-cli.bash
      zsh: completions/movidesk-cli.zsh
      fish: completions/movidesk-cli.fish
